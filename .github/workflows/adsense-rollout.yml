name: AdSense Rollout

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/adsense-rollout.yml"
      - "scripts/adsense_rollout.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Insert AdSense code and ads.txt
        run: python scripts/adsense_rollout.py

      - name: Commit rollout
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add AdSense code to all pages"
          git push origin HEAD:main
